<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Darwin Aveiga &#8212; Ingeniero de software y arquitecto de soluciones. Fundador de Abacore S.A.S.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1220"/>
      <stop offset="1" stop-color="#1A1F2E"/>
    </linearGradient>
    <pattern id="minor" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8892A6" stroke-opacity=".07"/>
    </pattern>
    <pattern id="major" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#8892A6" stroke-opacity=".14"/>
    </pattern>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#C0392B" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C0392B" stop-opacity=".22"/>
      <stop offset="1" stop-color="#C0392B" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
    .in { opacity: 0; animation: in .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .45s; } .d3 { animation-delay: .7s; }
    .d4 { animation-delay: .95s; } .d5 { animation-delay: 1.25s; } .d6 { animation-delay: 1.5s; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .scan { animation: scan 7s linear infinite; }
    @keyframes scan { from { transform: translateX(-260px); } to { transform: translateX(1260px); } }
    .flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }
    .flow.slow { animation-duration: 1.7s; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.35); } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .node rect { fill: #232839; stroke: #3A4158; }
    .node text { fill: #B0B8C8; font-size: 14px; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#minor)"/>
    <rect width="1200" height="320" fill="url(#major)"/>
    <rect class="scan" x="0" y="0" width="260" height="320" fill="url(#scan)"/>
    <rect x="0" y="0" width="6" height="320" fill="#C0392B"/>
  </g>

  <g class="mono in d1" font-size="14" fill="#8892A6">
    <text x="64" y="74">~/joan-mora <tspan fill="#C0392B">&#9679;</tspan> Colombia</text>
  </g>
  <text class="sans in d2" x="60" y="146" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Darwin Aveiga</text>
  <text class="sans in d3" x="64" y="186" font-size="22" font-weight="600" fill="#B0B8C8">Ingeniero de software &#183; Arquitecto de soluciones</text>
  <text class="sans in d4" x="64" y="216" font-size="17" fill="#8892A6">Software Engineer &#183; Solutions Architect</text>
  <g class="in d5">
    <rect x="64" y="240" width="250" height="34" rx="17" fill="#C0392B" fill-opacity=".14" stroke="#C0392B"/>
    <circle cx="84" cy="257" r="4" fill="#E74C3C"/>
    <text class="sans" x="98" y="262.5" font-size="15" font-weight="600" fill="#FFFFFF">Fundador de Abacore S.A.S.</text>
  </g>

  <g class="in d6">
    <rect x="862" y="34" width="318" height="252" rx="14" fill="none" stroke="#8892A6" stroke-opacity=".35" stroke-dasharray="4 6"/>
    <text class="mono" x="878" y="56" font-size="12" fill="#8892A6">cloud &#183; docker</text>

    <g fill="none" stroke="#C0392B" stroke-width="2">
      <path class="flow" d="M814 96 C 848 96, 846 160, 884 160"/>
      <path class="flow slow" d="M814 224 C 848 224, 846 160, 884 160"/>
      <path class="flow" d="M1004 160 C 1034 160, 1032 96, 1060 96"/>
      <path class="flow slow" d="M1004 160 C 1034 160, 1032 224, 1060 224"/>
    </g>

    <g class="node mono">
      <rect x="700" y="76" width="114" height="40" rx="9"/>
      <text x="757" y="101" text-anchor="middle">web &#183; react</text>
      <rect x="700" y="204" width="114" height="40" rx="9"/>
      <text x="757" y="229" text-anchor="middle">app &#183; pwa</text>
      <rect x="1060" y="76" width="108" height="40" rx="9"/>
      <text x="1114" y="101" text-anchor="middle">postgres</text>
      <rect x="1060" y="204" width="108" height="40" rx="9"/>
      <text x="1114" y="229" text-anchor="middle">redis &#183; ws</text>
    </g>

    <rect class="pulse" x="884" y="138" width="120" height="44" rx="10" fill="none" stroke="#E74C3C" stroke-width="2"/>
    <rect x="884" y="138" width="120" height="44" rx="10" fill="#2A1C24" stroke="#C0392B" stroke-width="1.5"/>
    <text class="mono" x="944" y="165" font-size="14" fill="#FFFFFF" text-anchor="middle">api</text>
    <rect class="blink" x="964" y="153" width="7" height="15" fill="#E74C3C"/>
  </g>
</svg>
